name: camera_flutter
description: >-
  Camera capture for Flutter with the goal of no additional system dependencies.  
  Integrates the `camera_dart` package and uses cargokit to build the native 
  Rust camera library and use it via FFI.
version: 0.0.2
repository: https://github.com/ManyMath/camera
issue_tracker: https://github.com/ManyMath/camera/issues
topics:
  - camera
  - capture
  - video
  - ffi

environment:
  sdk: ^3.10.0
  flutter: '>=3.3.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  camera_dart: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
