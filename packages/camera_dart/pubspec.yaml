name: camera_dart
description: >-
  Camera capture for Dart and Flutter with the goal of no additional system 
  dependencies.  Dart (no Flutter dependency) with native camera capture from 
  Rust via FFI.
version: 0.0.1
repository: https://github.com/ManyMath/camera
issue_tracker: https://github.com/ManyMath/camera/issues
topics:
  - camera
  - capture
  - video
  - ffi
  - cross-platform

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.1.0
  web: ^1.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

# Pub workspace member: shares the root lockfile.
resolution: workspace
